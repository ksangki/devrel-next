<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-label="DevRel의 활동이 사내 AI 확산의 장치로 옮겨간 자리" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>DevRel의 활동이 사내 AI 확산의 장치로 옮겨간 자리</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2a2033"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d4604a"/></marker></defs><rect width="1000" height="610" fill="#fbf7f2"/><text fill="#2a2033" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="38.0">DevRel의 활동이 사내 확산 장치로 옮겨간 자리</tspan></text><text fill="#5b4470" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="230.0" y="92.0">DevRel이 바깥에서 하던 일</tspan></text><text fill="#5b4470" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="770.0" y="92.0">사내 AI 확산의 장치</tspan></text><rect x="60" y="120" width="340" height="54" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="230.0" y="147.0">정기 밋업</tspan></text><rect x="600" y="120" width="340" height="54" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="770.0" y="138.2">매주 인에이블먼트 세션</tspan></text><text fill="#6f6479" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="770.0" y="159.0">Block</tspan></text><line x1="400" y1="147" x2="600" y2="147" stroke="#6f6479" stroke-width="1.4"/><rect x="60" y="192" width="340" height="54" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size