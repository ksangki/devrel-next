<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="강도를 올리고 사용량을 세면 생기는 일" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>강도를 올리고 사용량을 세면 생기는 일</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2a2033"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d4604a"/></marker></defs><rect width="1000" height="560" fill="#fbf7f2"/><text fill="#2a2033" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="38.0">강도를 올리고 사용량을 세면 생기는 일</tspan></text><rect x="90" y="70" width="400" height="66" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="290.0" y="103.0">강도 다이얼을 올림</tspan></text><path d="M290,140 L290,156" fill="none" stroke="#2a2033" stroke-width="2" marker-end="url(#mi)"/><rect x="90" y="162" width="400" height="66" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="290.0" y="195.0">측정이 사용량에 머묾</tspan></text><path d="M290,232 L290,248" fill="none" stroke="#2a2033" stroke-width="2" marker-end="url(#mi)"/><rect x="90" y="254" width="400" height="66" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="290.0" y="287.0">사용량이 평가와 이어짐</tspan></text><path d="M290,324 L290,340" fill="none" stroke="#2a2033" stroke-width="2" marker-end="url(#mi)"/><rect x="90" y="346" width="400" height="66" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="290.0" y="369.6">사용량을 연기함</tspan></text><text fill="#6f6479" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="290.0" y="391.8">토큰·LOC 리더보드, "biggest AI champion"</tspan></text><path d="M290,416 L290,432" fill="none" stroke="#2a2033" stroke-width="2" marker-end="url(#mi)"/><rect x="90" y="438" width="400" height="66" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="290.0" y="471.0">감시로 읽힘 · 냉소</tspan></text><rect x="600" y="150" width="330" height="100" rx="12" fill="#f7ddd5" stroke="#d4604a" stroke-width="2.5"/><text fill="#2a2033" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="765.0" y="190.1">사용량은 진단에만</tspan></text><text fill="#6f6479" font-size="14.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="765.0" y="213.5">'만든 증거'를 나란히 둔다</tspan></text><path d="M490,191 C540,191 550,200 594,200" fill="none" stroke="#d4604a" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#mc)"/><text fill="#6f6479" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="760.0" y="280.0">첫 줄에 무엇을 올리나</tspan></text></svg>