<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="문서가 유료 제품의 입구였던 Tailwind의 퍼널에 코딩 에이전트가 끼어든 자리" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>문서가 유료 제품의 입구였던 Tailwind의 퍼널에 코딩 에이전트가 끼어든 자리</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2a2033"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d4604a"/></marker></defs><rect width="1000" height="420" fill="#fbf7f2"/><text fill="#2a2033" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="38.0">Tailwind의 퍼널에 끼어든 코딩 에이전트</tspan></text><rect x="40" y="90" width="180" height="70" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="130.0" y="125.0">개발자</tspan></text><rect x="290" y="90" width="180" height="70" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="380.0" y="125.0">문서 사이트 방문</tspan></text><path d="M224,125.0 L284,125.0" fill="none" stroke="#2a2033" stroke-width="2" marker-end="url(#mi)"/><rect x="540" y="90" width="180" height="70" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="630.0" y="125.0">유료 제품을 알게 됨</tspan></text><path d="M474,125.0 L534,125.0" fill="none" stroke="#2a2033" stroke-width="2" marker-end="url(#mi)"/><rect x="790" y="90" width="180" height="70" rx="12" fill="#fffdfa" stroke="#ddd2dc" stroke-width="1.8"/><text fill="#2a2033" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="880.0" y="125.0">고객</tspan></text><path d="M724,125.0 L784,125.0" fill="none" stroke="#2a2033" stroke-width="2" marker-end="url(#mi)"/><text fill="#6f6479" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="186.0">Wathan: "The docs are the only way people find out about our commercial products …"</tspan></text><rect x="290" y="270" width="430" height="76" rx="12" fill="#f7ddd5" stroke="#d4604a" stroke-width="2.5"/><text fill="#2a2033" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="505.0" y="308.0">코딩 에이전트가 Tailwind 클래스를 대신 씀</tspan></text><path d="M130,164 C130,300 200,308 284,308" fill="none" stroke="#d4604a" stroke-width="3" marker-end="url(#mc)"/><text fill="#d4604a" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="146.0" y="236.0">문서 방문 없이 채택</tspan></text><path d="M505,270 L380,202" fill="none" stroke="#2a2033" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mi)"/><text fill="#6f6479" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="560.0" y="236.0">방문 기록이 남지 않음</tspan></text><text fill="#6f6479" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="392.0">에이전트 경로는 이 책의 해석 — Wathan은 원인을 AI의 영향으로만 말했다</tspan></text></svg>